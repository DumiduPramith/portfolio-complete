<ng-container *ngIf="!isLoggedIn; else RouterOutlet">
  <app-login (OnSuccessLogin)="onLoginSuccess()"></app-login>
</ng-container>

<ng-template #RouterOutlet>
  <app-toolbar></app-toolbar>
  <app-side-nav></app-side-nav>
  <div class="main-content" id="mainContent">
    <div class="p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-template>
