<div class="d-flex px-4 py-3 h-100 rounded border-amber-200 card-border">
  <div class="d-flex gap-3 align-items-center">
    <span class="drag-handle me-2" cdkDragHandle>
      <fa-icon [icon]="faGripVertical"></fa-icon>
    </span>
    <img
      [src]="iconUrl"
      [alt]="name"
      class="skill-card item-tech-transition img-tech"
    />
    <div class="d-flex align-items-center">
      <h4 class="m-0 item-tech-transition tech">{{ name }}</h4>
      <p
        class="m-0 fw-500 mt-3 position-absolute text-amber-200 item-tech-transition opacity-0 status-tech"
        style="font-size: 14px"
      >
        {{ description }}
      </p>
    </div>
  </div>
  <div class="d-flex align-items-center justify-content-end w-100">
    <span
      role="button"
      (click)="toggleVisibility(skillFormGroup)"
      class="icon-container"
      [class.d-none]="!skillFormGroup.get('isActive')?.value"
    >
      <fa-icon [icon]="faEye"></fa-icon>
    </span>
    <span
      role="button"
      (click)="toggleVisibility(skillFormGroup)"
      class="icon-container"
      [class.d-none]="skillFormGroup.get('isActive')?.value"
    >
      <fa-icon [icon]="faEyeSlash"></fa-icon>
    </span>
  </div>
</div>
