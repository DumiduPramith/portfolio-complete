<div
  class="d-flex px-4 py-3 h-100 rounded border-amber-200 card-border item-tech hover:bg-amber-200 hover:bg-opacity-10"
>
  <div class="d-flex gap-3 align-items-center">
    <span class="drag-handle me-2" cdkDragHandle>
      <fa-icon [icon]="faGripVertical"></fa-icon>
    </span>
    <img
      [src]="iconUrl"
      [alt]="name"
      class="skill-card item-tech-transition img-tech"
    />
    <div class="d-flex align-items-center">
      <h4 class="m-0 item-tech-transition tech">{{ name }}</h4>
      <p
        class="m-0 fw-500 mt-3 position-absolute item-tech-transition opacity-0 status-tech"
        style="font-size: 14px; color: #fff"
      >
        {{ description }}
      </p>
    </div>
  </div>
  <div class="d-flex flex-column align-items-center justify-content-end w-100">
    <span
      role="button"
      (click)="toggleVisibility(skillFormGroup)"
      class="icon-container"
      [class.disabled]="skillFormGroup.disabled"
      [class.d-none]="!skillFormGroup.get('isActive')?.value"
    >
      <fa-icon [icon]="faEye"></fa-icon>
    </span>
    <span
      role="button"
      (click)="toggleVisibility(skillFormGroup)"
      class="icon-container"
      [class.disabled]="skillFormGroup.disabled"
      [class.d-none]="skillFormGroup.get('isActive')?.value"
    >
      <fa-icon [icon]="faEyeSlash"></fa-icon>
    </span>
    <div
      class="cursor-pointer"
      [class.disabled]="skillFormGroup.disabled"
      (click)="removeSkill(skillFormGroup)"
    >
      <fa-icon [icon]="faTrash"></fa-icon>
    </div>
  </div>
</div>
