<div formArrayName="professions" class="mb-3">
  <label class="form-label">{{ label }}</label>
  <ul
    id="professionList"
    class="list-group"
    cdkDropList
    [cdkDropListDisabled]="formArray.disabled"
    (cdkDropListDropped)="drop($event)"
  >
    @for(profession of formArray.controls; track profession; let i = $index){
    <li
      class="list-group-item d-flex justify-content-between align-items-center"
      cdkDrag
      [cdkDragData]="i"
    >
      <div class="d-flex align-items-center">
        <span class="drag-handle me-2" cdkDragHandle>
          <fa-icon [icon]="faGripVertical"></fa-icon>
        </span>
        <span class="ms-3">
          {{ profession.get(valueControllerName)?.value }}
        </span>
      </div>
      <div class="d-flex align-items-center">
        <div role="button" class="me-4" (click)="toggleVisibility(profession)">
          <span
            class="icon-container"
            [class.disabled]="formArray.disabled"
            [class.hidden]="!profession.get('isActive')?.value"
          >
            <fa-icon [icon]="faEye"></fa-icon>
          </span>
          <span
            class="icon-container"
            [class.disabled]="formArray.disabled"
            [class.hidden]="profession.get('isActive')?.value"
          >
            <fa-icon [icon]="faEyeSlash"></fa-icon>
          </span>
        </div>
        <button
          type="button"
          class="btn btn-danger btn-sm delete-profession"
          (click)="deleteProfession(i)"
          [disabled]="formArray.disabled"
        >
          Delete
        </button>
      </div>
    </li>
    }
  </ul>
</div>
