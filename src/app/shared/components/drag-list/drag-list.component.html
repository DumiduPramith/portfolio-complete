<div class="mb-4" formArrayName="professions">
  <label class="form-label">Professions</label>
  <ul
    id="professionList"
    class="list-group"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
  >
    @for(profession of professions.controls; track profession; let i = $index){
    <li
      class="list-group-item d-flex justify-content-between align-items-center"
      cdkDrag
      [cdkDragData]="i"
    >
      <div class="d-flex align-items-center">
        <span class="drag-handle me-2" cdkDragHandle>
          <fa-icon [icon]="faGripVertical"></fa-icon>
        </span>
        {{ profession.get("professionName")?.value }}
      </div>
      <div class="d-flex">
        <div role="button" class="me-4" (click)="toggleVisibility(profession)">
          <span
            class="icon-container"
            [class.hidden]="!profession.get('isActive')?.value"
          >
            <fa-icon [icon]="faEye"></fa-icon>
          </span>
          <span
            class="icon-container"
            [class.hidden]="profession.get('isActive')?.value"
          >
            <fa-icon [icon]="faEyeSlash"></fa-icon>
          </span>
        </div>
        <button
          type="button"
          class="btn btn-danger btn-sm delete-profession"
          (click)="deleteProfession(i)"
        >
          Delete
        </button>
      </div>
    </li>
    }
  </ul>
  <div class="input-group mt-3">
    <input
      type="text"
      id="newProfession"
      class="form-control"
      placeholder="Add a profession"
      #newProfessionInput
      (keyup.enter)="addProfession(newProfessionInput)"
    />
    <button
      type="button"
      id="addProfession"
      class="btn btn-primary"
      (click)="addProfession(newProfessionInput)"
    >
      Add
    </button>
  </div>
</div>
